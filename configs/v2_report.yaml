# CPU template baseline; switch backend to hf_local after installing a local model.
backend: template
model_path: null
revision: null
max_new_tokens: 4096
max_input_tokens: 8192
max_time_seconds: 120
use_4bit: false
local_files_only: true
adapter_path: null
max_repairs: 1
fallback: true
# Current source grading-to-level mapping is unverified. Preview remains needs_review.
require_verified: false
